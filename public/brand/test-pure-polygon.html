<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyxis Pure 1-Polygon Contour Test</title>
  <style>
    body {
      background: #07080B;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      gap: 30px;
    }
    .preview {
      background: #0E1117;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .scales {
      display: flex;
      gap: 24px;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Lyxis — The Monolithic Delta Keystone (Pure 1-Polygon Contour)</h1>
  <div class="preview">
    <!-- Rendered in pure monochrome stark white -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="180" height="180" fill="#F8FAFC">
      <polygon points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82" />
    </svg>
    <div style="font-size: 13px; color: #94A3B8;">1 BIDANG TUNGGAL MURNI • 9 TITIK KOORDINAT SIMETRIS</div>
  </div>

  <div class="preview">
    <h3>Uji Warna Tunggal: Hyper-Safety Orange (#FF3700)</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="140" height="140" fill="#FF3700">
      <polygon points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82" />
    </svg>
  </div>

  <div class="preview">
    <h3>Uji Skala Mikro (64px, 32px, 16px)</h3>
    <div class="scales">
      <svg viewBox="0 0 100 100" width="64" height="64" fill="#F8FAFC">
        <polygon points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82" />
      </svg>
      <svg viewBox="0 0 100 100" width="32" height="32" fill="#F8FAFC">
        <polygon points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82" />
      </svg>
      <svg viewBox="0 0 100 100" width="16" height="16" fill="#F8FAFC">
        <polygon points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82" />
      </svg>
    </div>
  </div>
</body>
</html>
