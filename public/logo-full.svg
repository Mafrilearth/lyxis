<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="fullLyxisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fullChamferHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left: Monogram Icon (48x48) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="#0B0C10" />
    <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <path
      d="M15 12
         L24 12
         L24 27
         L35 27
         L35 36
         L15 36
         Z"
      fill="url(#fullLyxisGrad)"
    />
    <path
      d="M15 12
         L21 12
         L15 18
         Z"
      fill="url(#fullChamferHighlight)"
    />
  </g>

  <!-- Right: Wordmark & Descriptor Typography -->
  <g transform="translate(68, 14)">
    <!-- Brand Wordmark -->
    <text
      x="0"
      y="22"
      fill="#F8FAFC"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="24"
      font-weight="900"
      letter-spacing="-0.04em"
    >
      LYXIS
    </text>

    <!-- CBT Pill Tag -->
    <rect x="74" y="6" width="36" height="18" rx="9" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(37, 99, 235, 0.35)" stroke-width="1" />
    <text
      x="83"
      y="18.5"
      fill="#60A5FA"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="9"
      font-weight="800"
      letter-spacing="0.08em"
    >
      CBT
    </text>

    <!-- Official Brand Descriptor -->
    <text
      x="0"
      y="38"
      fill="#94A3B8"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="10.5"
      font-weight="600"
      letter-spacing="0.06em"
      text-transform="uppercase"
    >
      Diagnostic Simulator
    </text>
  </g>
</svg>
