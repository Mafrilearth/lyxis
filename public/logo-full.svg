<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Left: Delta Keystone Monolith Icon (48x48 Chassis) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="#0B0C10" />
    <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <!-- Pure 1-Field Monochromatic Polygon -->
    <g transform="translate(7, 7) scale(0.34)">
      <polygon
        points="16,20 84,20 54,82 54,52 64,52 50,34 36,52 46,52 46,82"
        fill="#FF3700"
      />
    </g>
  </g>

  <!-- Right: Wordmark & Descriptor Typography -->
  <g transform="translate(68, 14)">
    <!-- Brand Wordmark -->
    <text
      x="0"
      y="22"
      fill="#F8FAFC"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="24"
      font-weight="900"
      letter-spacing="-0.04em"
    >
      LYXIS
    </text>

    <!-- CBT Pill Tag -->
    <rect x="74" y="6" width="36" height="18" rx="9" fill="rgba(255, 55, 0, 0.15)" stroke="rgba(255, 55, 0, 0.4)" stroke-width="1" />
    <text
      x="83"
      y="18.5"
      fill="#FF5500"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="9"
      font-weight="800"
      letter-spacing="0.08em"
    >
      CBT
    </text>

    <!-- Official Brand Descriptor -->
    <text
      x="0"
      y="38"
      fill="#94A3B8"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="10.5"
      font-weight="600"
      letter-spacing="0.06em"
      text-transform="uppercase"
    >
      TOEFL Diagnostic
    </text>
  </g>
</svg>
